<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webm → mp3 / mp4 変換</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob blob-1" aria-hidden="true"></div>
  <div class="blob blob-2" aria-hidden="true"></div>
  <div class="blob blob-3" aria-hidden="true"></div>

  <main class="card">
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div>
        <h1><span class="fmt">webm</span><span class="arrow">→</span><span class="fmt fmt-mp3">mp3 / mp4</span></h1>
        <p class="note">🔒 ファイルはこのPC内で変換され、外部には送信されません</p>
      </div>
    </header>

    <div id="dropzone" tabindex="0" role="button" aria-label="webmファイルを選択">
      <svg class="drop-icon" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
      <p id="dropText">ここにwebmファイルをドラッグ&amp;ドロップ<br>またはクリックして選択</p>
      <input id="fileInput" type="file" accept=".webm,video/webm,audio/webm" hidden>
    </div>

    <section id="waveWrap" hidden>
      <div class="wave-tools">
        <button type="button" class="tool play" id="playBtn" title="再生 / 一時停止（波形の上でスペースキー）" disabled>▶ 再生</button>
        <button type="button" class="tool" id="zoomOut" title="縮小（-キー）" aria-label="縮小">－</button>
        <button type="button" class="tool" id="zoomIn" title="拡大（+キー）" aria-label="拡大">＋</button>
        <button type="button" class="tool" id="zoomFit" title="全体を表示（0キー）">全体</button>
        <button type="button" class="tool" id="zoomSel" title="選択範囲を拡大" disabled>選択範囲へ</button>
        <span class="tool-hint">ホイール: 拡大縮小 ／ Shift+ホイール: 移動 ／ クリック: 再生位置 ／ スペース: 再生</span>
      </div>
      <canvas id="wave" tabindex="0" role="img" aria-label="音声の波形。ドラッグで開始・終了の範囲を選択、クリックで解除。プラスとマイナスのキーで拡大縮小、左右キーで移動"></canvas>
      <div id="waveScroll" role="group" aria-label="表示位置のスクロールバー"><div id="waveScrollInner"></div></div>
      <p id="waveInfo"></p>
    </section>

    <section class="settings">
      <label>
        <span class="label-text">📦 出力形式</span>
        <select id="format">
          <option value="mp3" selected>mp3（音声のみ）</option>
          <option value="mp4">mp4（映像＋音声）</option>
        </select>
      </label>
      <label class="video-opt" hidden>
        <span class="label-text">🖥️ 解像度</span>
        <select id="resolution">
          <option value="orig">元のまま</option>
          <option value="1080">1080p 以下</option>
          <option value="720" selected>720p 以下</option>
          <option value="480">480p 以下</option>
        </select>
      </label>
      <label class="video-opt" hidden>
        <span class="label-text">🎞️ 画質（変換速度）</span>
        <select id="quality">
          <option value="high">高画質（遅い）</option>
          <option value="standard" selected>標準</option>
          <option value="fast">高速（画質は低め）</option>
        </select>
      </label>
      <label>
        <span class="label-text" id="bitrateLabel">🎚️ ビットレート</span>
        <select id="bitrate">
          <option value="128">128 kbps（標準）</option>
          <option value="192" selected>192 kbps（高音質）</option>
          <option value="256">256 kbps（より高音質）</option>
          <option value="320">320 kbps（最高音質）</option>
        </select>
      </label>
      <label>
        <span class="label-text">⏱️ 開始時間</span>
        <input id="startTime" type="text" placeholder="例: 0:30（空欄=最初）">
      </label>
      <label>
        <span class="label-text">⏹️ 終了時間</span>
        <input id="endTime" type="text" placeholder="例: 1:45（空欄=最後）">
      </label>
    </section>

    <p id="videoNote" class="video-note" hidden>⚠️ mp4への変換は、ブラウザ内で映像を再エンコードするため時間がかかります（目安: 動画の長さの数倍〜）。解像度を下げ、画質を「高速」にすると速くなります。</p>

    <div class="buttons">
      <button id="convertBtn" disabled>✨ mp3に変換</button>
      <button id="cancelBtn" hidden>✖ 中止</button>
    </div>

    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status" role="status"></p>
    <p id="error" role="alert" hidden></p>
    <div id="result" hidden></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
